[package]
name = "productivity-timer"
version = "0.2.1"
description = "A client-only productivity timer, packaged as a desktop app with Tauri."
authors = ["hyeyeonghwang"]
edition = "2021"
rust-version = "1.77.2"

# See https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[lib]
# The library name the Tauri desktop binary links against on mobile/desktop.
name = "productivity_timer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
